# Every push runs the suite where we do not have a machine at hand (Linux and Windows), proves the air-gapped
# install, and runs on a RHEL-family container. macOS and the extra Node versions run weekly and on demand:
# macOS runners are billed at 10x on a private repo and the developer's Mac already covers macOS on every build.
# Keep it fast: the suite runs in well under a minute, so the matrix stays cheap.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC: the full matrix
  workflow_dispatch: # run the full matrix by hand, e.g. before a release

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Every push: the two platforms we cannot test on the desk.
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        env:
          CI: "true"
          # CI runners are noisy; performance gates stay strict locally and are relaxed here (see docs/test-plan.md)
          YENOP_CI_PERF_FACTOR: "4"

  # Weekly and on demand: macOS (10x billing) and the oldest and newest supported Node lines.
  test-full:
    name: full matrix (${{ matrix.os }}, node ${{ matrix.node }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            node: 24
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        env:
          CI: "true"
          YENOP_CI_PERF_FACTOR: "4"

  # The air-gapped story, proven for real: build the offline bundle on a machine with network, then install and
  # run it inside a container that has no network at all.
  offline-install:
    name: offline install (no network)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run pack:offline
      - name: install and run inside a container with --network none
        run: |
          set -euo pipefail
          tgz=$(ls yenop-offline-*.tgz)
          docker run --rm --network none -v "$PWD/$tgz:/in/$tgz:ro" node:24-slim sh -euc '
            mkdir -p /opt && cd /opt && tar -xzf /in/'"$tgz"'
            ln -s /opt/yenop/dist/cli/main.js /usr/local/bin/yenop && chmod +x /opt/yenop/dist/cli/main.js
            yenop --help | head -3
            yenop demo --no-color | grep -E "BLOCKED|ASK" | head -3
            yenop explain Bash "{\"command\":\"cat ~/.ssh/id_ed25519\"}" | grep -q DENY
            echo "offline install OK"
          '

  # A bank runs a RHEL-family Linux, not Ubuntu. Run the suite there too, in a container.
  rhel-family:
    name: test (rockylinux 9 container)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: rockylinux:9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          CI: "true"
          YENOP_CI_PERF_FACTOR: "4"
